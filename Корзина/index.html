<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма заявки на оплату</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="https://api.bitrix24.com/api/v1/"></script>
  </head>

  <body>
    <main class="container">
      <div class="layout">
        <form id="expenseForm" class="form" autocomplete="off">
          <!-- Инициатор -->
          <div class="field">
            <label class="label" for="initiator">Инициатор</label>
            <select
              id="initiator"
              name="initiatorId"
              class="control"
              required
              autocomplete="off"
            ></select>
            <div class="hint is-hidden" id="initiatorHint"></div>
          </div>

          <!-- Должность инициатора -->
          <div class="field">
            <label class="label" for="initiatorPosition"
              >Должность инициатора</label
            >
            <input
              id="initiatorPosition"
              name="initiatorPosition"
              class="control"
              type="text"
              placeholder="Должность не указана"
              readonly
              autocomplete="off"
            />
          </div>

          <!-- Дилерский центр -->
          <div class="field">
            <label class="label" for="dealerCenter">Дилерский центр</label>
            <select
              id="dealerCenter"
              name="dealerCenterId"
              class="control"
              autocomplete="off"
            ></select>
            <div id="dealerCenterHint" class="hint is-hidden"></div>
          </div>

          <!-- Подразделения -->
          <div class="field">
            <label class="label" for="expenseDepartment">Подразделения</label>
            <select
              id="expenseDepartment"
              name="expenseDepartmentId"
              class="control"
              data-depends-on="dealerCenter"
              autocomplete="off"
            ></select>
            <div id="expenseDepartmentHint" class="hint is-hidden"></div>
          </div>

          <!-- Статья затрат -->
          <div class="field">
            <label class="label" for="expenseCategory">Статья затрат</label>
            <select
              id="expenseCategory"
              name="expenseCategoryId"
              class="control"
              autocomplete="off"
            ></select>
            <div id="expenseCategoryHint" class="hint is-hidden"></div>
          </div>

          <!-- Подстатья -->
          <div class="field">
            <label class="label" for="expenseSubcategory">Подстатья</label>
            <select
              id="expenseSubcategory"
              name="expenseSubcategoryId"
              class="control"
              data-depends-on="expenseCategory"
              autocomplete="off"
            ></select>
            <div id="expenseSubcategoryHint" class="hint is-hidden"></div>
          </div>

          <!-- Название -->
          <div class="field">
            <label class="label" for="title">Название</label>
            <input
              id="title"
              name="title"
              class="control"
              type="text"
              placeholder="Укажите название"
              required
              autocomplete="off"
            />
          </div>

          <!-- Сумма + Валюта -->
          <div class="field">
            <label class="label" for="amount">Сумма</label>
            <div class="row2">
              <input
                id="amount"
                name="amount"
                class="control"
                type="number"
                step="0.01"
                min="0"
                placeholder="0.00"
                required
                autocomplete="off"
              />
              <div>
                <label class="label" for="currency" style="display: none"
                  >Валюта</label
                >
                <select
                  id="currency"
                  name="currency"
                  class="control"
                  required
                  autocomplete="off"
                ></select>
                <div id="currencyHint" class="hint is-hidden"></div>
              </div>
            </div>
          </div>

          <!-- Тип оплаты + Форма оплаты -->
          <div class="field">
            <label class="label">Тип оплаты</label>
            <div class="row2">
              <select
                id="paymentType"
                name="paymentType"
                class="control"
                required
                autocomplete="off"
              ></select>

              <select
                id="paymentTiming"
                name="paymentTiming"
                class="control"
                required
                autocomplete="off"
              ></select>
            </div>
          </div>

          <!-- Контрагент -->
          <div class="field">
            <label class="label" for="contractor">Контрагент</label>
            <input
              id="contractor"
              name="contractor"
              class="control"
              type="text"
              placeholder="..."
              autocomplete="off"
            />
          </div>

          <!-- № договора -->
          <div class="field">
            <label class="label" for="contractNo">№ договора</label>
            <input
              id="contractNo"
              name="contractNo"
              class="control"
              type="text"
              placeholder="..."
              autocomplete="off"
            />
          </div>

          <!-- № счета -->
          <div class="field">
            <label class="label" for="invoiceNo">№ счета</label>
            <input
              id="invoiceNo"
              name="invoiceNo"
              class="control"
              type="text"
              placeholder="..."
              autocomplete="off"
            />
          </div>

          <!-- Необходимость расхода -->
          <div class="field">
            <label class="label" for="needText">Необходимость расхода</label>
            <textarea
              id="needText"
              name="needText"
              class="control"
              rows="4"
              placeholder="Опишите необходимость и детали оплаты..."
              autocomplete="off"
            ></textarea>
          </div>

          <!-- Файлы -->
          <div class="field">
            <label class="label" for="files">Файлы</label>
            <label class="input-file">
              <span class="input-file-text" data-placeholder="Файлы не выбраны"
                >Файлы не выбраны</span
              >
              <input id="files" name="files" type="file" multiple />
              <span class="input-file-btn">Выбрать</span>
            </label>
          </div>

          <div class="actions">
            <button class="btn" type="submit">Отправить на согласование</button>
          </div>
        </form>
      </div>
    </main>

    <div id="page-preloader" class="preloader">
      <div class="preloader__spinner"></div>
      <div class="preloader__text">Загрузка...</div>
    </div>

    <div id="submit-overlay" class="submit-overlay">
      <div class="submit-overlay__backdrop"></div>
      <div class="submit-overlay__modal">
        <div class="submit-overlay__status" id="submitStatus">
          Создание СЗ...
        </div>
        <div class="submit-overlay__link" id="submitLink"></div>
        <button type="button" class="submit-overlay__close" id="submitClose">
          Закрыть
        </button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
